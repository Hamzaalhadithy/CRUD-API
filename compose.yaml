services:
  api:
    build: .
    ports: ["3000:80"]
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/tasks
    env_file:
      - .env
    depends_on: [db]
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql]

volumes:
 taskdata: